<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Manager</title>

  <!-- Google Fonts: Syne · DM Mono · DM Sans (PRD spec) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════════════════════════
       DESIGN TOKENS  ·  Exact values from PRD — do not change
    ══════════════════════════════════════════════════════════════════ */
    :root {
      --bg:    #020101;
      --sb:    #0c0504;
      --card:  #110605;
      --card2: #160807;
      --b1:    #1e0e09;
      --b2:    #2d1610;
      --rust:  #b7410e;
      --rust2: #d4531a;
      --amber: #e07b2a;
      --white: #ffffff;
      --dim:   rgba(255,255,255,.55);
      --muted: rgba(255,255,255,.28);
      --faint: rgba(255,255,255,.10);
      --green: #5faa3e;
      --blue:  #4a9ebb;
    }

    /* Light mode overrides — colour toggled in Phase 4 */
    body.light {
      --bg:    #ffffff;
      --sb:    #f5f5f5;
      --card:  #f9f9f9;
      --card2: #f0f0f0;
      --b1:    #e0e0e0;
      --b2:    #cccccc;
      --white: #1a1a1a;
      --dim:   rgba(0,0,0,.65);
      --muted: rgba(0,0,0,.40);
      --faint: rgba(0,0,0,.07);
      /* --rust, --rust2, --amber, --green, --blue: unchanged */
    }

    /* ══════════════════════════════════════════════════════════════════
       RESET
    ══════════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Selection highlight */
    ::selection { background: rgba(183,65,14,.35); }

    /* Custom scrollbar — 4px, --b2 thumb, no track */
    ::-webkit-scrollbar              { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track        { background: transparent; }
    ::-webkit-scrollbar-thumb        { background: var(--b2); border-radius: 2px; }

    /* ══════════════════════════════════════════════════════════════════
       BASE
    ══════════════════════════════════════════════════════════════════ */
    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 0.2s colour transition for theme toggling (Phase 4) */
    body, #top-bar, #main-area, #tab-bar {
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    /* ══════════════════════════════════════════════════════════════════
       LAYOUT SKELETON
       top-bar  52px fixed top
       main-area  fills between top-bar and tab-bar, scrollable
       tab-bar  64px fixed bottom, horizontal scroll
    ══════════════════════════════════════════════════════════════════ */

    #top-bar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 52px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      background: var(--sb);
      border-bottom: 1px solid var(--b1);
    }

    #main-area {
      position: fixed;
      inset: 52px 0 64px 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 32px 24px;
      background: var(--bg);
    }

    #tab-bar {
      position: fixed;
      inset: auto 0 0 0;
      height: 64px;
      z-index: 100;
      display: flex;
      align-items: flex-end;    /* tabs sit flush with bar bottom */
      gap: 2px;
      padding: 0 8px;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--sb);
      border-top: 1px solid var(--b1);
    }

    /* ══════════════════════════════════════════════════════════════════
       BRAND MARK  ·  urlmgr
    ══════════════════════════════════════════════════════════════════ */
    #brand {
      flex-shrink: 0;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      letter-spacing: -0.04em;
    }
    #brand .b-url { color: var(--rust2); font-weight: 800; }
    #brand .b-mgr { color: var(--dim);   font-weight: 600; }

    /* Phase 3: search wrap takes the centre slot; Phase 4 will populate #top-actions */
    #search-wrap {
      flex: 1;
      position: relative;
      max-width: 520px;
    }
    #top-actions {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ══════════════════════════════════════════════════════════════════
       EMPTY STATE  ·  shown when active sheet has no folders
    ══════════════════════════════════════════════════════════════════ */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      color: var(--muted);
      text-align: center;
      user-select: none;
    }
    .empty-state svg    { opacity: 0.18; }
    .empty-state strong { color: var(--dim); font-weight: 500; }

    /* ══════════════════════════════════════════════════════════════════
       SHEET TABS
    ══════════════════════════════════════════════════════════════════ */
    .sheet-tab {
      position: relative;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      min-width: 96px;
      max-width: 172px;
      height: 52px;
      padding: 0 24px 0 11px;   /* 24px right: space for ✕ button */
      border-radius: 6px 6px 0 0;
      border-top: 2px solid transparent;
      cursor: pointer;
      user-select: none;
      background: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .sheet-tab:hover:not(.active) { background: var(--b1); }

    /* Active tab: rust top border + bg matching main area (visual "lift") */
    .sheet-tab.active {
      border-top-color: var(--rust);
      background: var(--bg);
    }
    .sheet-tab.active:hover { background: var(--bg); }

    /* Tab name — Syne 600 */
    .tab-name {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 144px;
      line-height: 1.3;
      transition: color 0.15s;
    }
    .sheet-tab.active .tab-name { color: var(--white); }

    /* Last edit date — DM Mono small */
    .tab-date {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1;
    }

    /* Delete ✕ — appears only on tab hover */
    .tab-del {
      position: absolute;
      top: 7px;
      right: 5px;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .sheet-tab:hover .tab-del  { opacity: 1; pointer-events: auto; }
    .tab-del:hover             { background: var(--rust); color: #fff; }

    /* ── Inline rename input ─────────────────────────────────────── */
    .tab-rename-input {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--white);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--rust);
      outline: none;
      width: 88px;
      padding: 0;
      line-height: 1.3;
    }

    /* ── Drag-to-reorder visual states ───────────────────────────── */
    .sheet-tab.dragging  { opacity: 0.3; }
    .sheet-tab.drag-over { box-shadow: inset 2px 0 0 var(--rust2); }

    /* ── + New sheet button ──────────────────────────────────────── */
    #tab-add {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      margin-left: 4px;
      margin-bottom: 12px;   /* visually centres in 64px bar beside 52px tabs */
      cursor: pointer;
      color: var(--muted);
      font-size: 20px;
      font-weight: 300;
      line-height: 1;
      transition: background 0.15s, color 0.15s;
    }
    #tab-add:hover { background: var(--b1); color: var(--white); }

    /* ── Inline create-sheet input ───────────────────────────────── */
    .tab-create-input {
      flex-shrink: 0;
      align-self: flex-end;   /* bottom-aligns with tabs */
      height: 52px;
      min-width: 112px;
      padding: 0 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--white);
      background: var(--card);
      border: 1.5px solid var(--rust);
      border-radius: 6px 6px 0 0;
      outline: none;
    }
    .tab-create-input::placeholder { color: var(--muted); }

    /* ══════════════════════════════════════════════════════════════════
       CONFIRMATION DIALOG
    ══════════════════════════════════════════════════════════════════ */
    .dlg-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2,1,1,.70);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .dlg-box {
      width: 90%;
      max-width: 360px;
      padding: 24px;
      background: var(--card2);
      border: 1px solid var(--b2);
      border-radius: 10px;
    }
    .dlg-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--white);
      margin-bottom: 8px;
    }
    .dlg-msg {
      font-size: 13px;
      color: var(--dim);
      line-height: 1.55;
      margin-bottom: 22px;
    }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Dialog entrance — brief scale-in creates a timing gap that prevents
       an accidental second click from landing on the confirm button        */
    @keyframes dlg-in {
      from { opacity: 0; transform: scale(0.94) translateY(8px); }
      to   { opacity: 1; transform: scale(1)    translateY(0);   }
    }
    .dlg-box { animation: dlg-in 0.15s ease; }

    .btn {
      padding: 7px 15px;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      outline: none;
      transition: background 0.15s;
    }
    .btn-ghost        { background: var(--b2);   color: var(--dim);   }
    .btn-ghost:hover  { background: var(--b1);   color: var(--white); }
    .btn-danger       { background: var(--rust);  color: #fff;         }
    .btn-danger:hover { background: var(--rust2);                      }

    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — FOLDERS + LINKS
    ══════════════════════════════════════════════════════════════════ */

    /* Extra bottom padding so content clears the pinned Add Folder bar */
    #main-area { padding-bottom: 80px; }

    /* ── Add Folder Bar (pinned just above tab bar) ───────────────── */
    #folder-add-bar {
      position: fixed;
      bottom: 64px;
      left: 0; right: 0;
      padding: 18px 24px 10px;
      background: linear-gradient(to top, var(--bg) 55%, transparent);
      z-index: 90;
      pointer-events: none;       /* gradient doesn't block scroll */
    }
    #btn-add-folder {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--dim);
      background: var(--card);
      border: 1px solid var(--b2);
      border-radius: 6px;
      cursor: pointer;
      pointer-events: all;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    #btn-add-folder:hover {
      color: var(--white);
      border-color: var(--rust);
      background: var(--card2);
    }

    /* ── Folder list wrapper ──────────────────────────────────────── */
    #folder-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Folder card ──────────────────────────────────────────────── */
    .folder-card {
      background: var(--card);
      border: 1px solid var(--b1);
      border-radius: 8px;
      overflow: hidden;
    }
    .folder-card.folder-drag-over { box-shadow: 0 -3px 0 var(--rust); }

    /* ── Folder header row ────────────────────────────────────────── */
    .folder-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px 9px 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .folder-header:hover { background: var(--b1); }

    /* Chevron rotates when collapsed */
    .folder-chevron {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      color: var(--muted);
      transition: transform 0.2s ease;
    }
    .folder-card.collapsed .folder-chevron { transform: rotate(-90deg); }

    /* Folder name */
    .folder-name {
      flex: 1;
      min-width: 0;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Inline rename input */
    .folder-rename-inp {
      flex: 1;
      min-width: 0;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--white);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--rust);
      outline: none;
      padding: 0;
    }

    /* Link-count badge */
    .folder-badge {
      flex-shrink: 0;
      font-family: 'DM Mono', monospace;
      font-size: 10.5px;
      color: var(--muted);
      background: var(--b1);
      border-radius: 10px;
      padding: 1px 8px;
      line-height: 1.6;
    }

    /* Drag-handle (dots grid) */
    .folder-drag-hdl {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: var(--muted);
      cursor: grab;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .folder-header:hover .folder-drag-hdl { opacity: 1; }
    .folder-drag-hdl:active { cursor: grabbing; }

    /* Delete icon button */
    .folder-del {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }
    .folder-header:hover .folder-del { opacity: 1; }
    .folder-del:hover { color: var(--rust2); background: var(--b2); }

    /* ── Folder body / collapse animation ────────────────────────── */
    .folder-body {
      overflow: hidden;
      max-height: 4000px;
      transition: max-height 0.25s ease;
    }
    .folder-card.collapsed .folder-body { max-height: 0; }

    /* ── Link column header ───────────────────────────────────────── */
    .link-col-hdr {
      display: grid;
      grid-template-columns: 22px 25fr 35fr 35fr 52px;
      padding: 4px 10px 4px 8px;
      border-top: 1px solid var(--b1);
      border-bottom: 1px solid var(--b1);
      background: var(--card2);
    }
    .link-col-hdr span {
      padding: 0 4px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* ── Link row ─────────────────────────────────────────────────── */
    .link-row {
      display: grid;
      grid-template-columns: 22px 25fr 35fr 35fr 52px;
      align-items: center;
      min-height: 38px;
      padding: 0 10px 0 8px;
      border-bottom: 1px solid var(--faint);
      transition: background 0.15s;
    }
    .link-rows-wrap .link-row:last-child { border-bottom: none; }
    .link-row:hover { background: var(--card2); }
    .link-row.link-drag-over { box-shadow: 0 -2px 0 var(--rust); }

    /* ── Link drag handle ─────────────────────────────────────────── */
    .link-drag-hdl {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      cursor: grab;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .link-row:hover .link-drag-hdl { opacity: 1; }
    .link-drag-hdl:active { cursor: grabbing; }

    /* ── Link cell (display) ──────────────────────────────────────── */
    .link-cell {
      padding: 6px 8px 6px 4px;
      min-width: 0;
      overflow: hidden;
      cursor: text;
    }
    .lc-inner {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lc-inner.ph { color: var(--muted); font-style: italic; }
    .lc-inner a  { color: var(--blue); text-decoration: none; }
    .lc-inner a:hover { text-decoration: underline; }

    /* ── Link cell (edit) ─────────────────────────────────────────── */
    .link-cell-inp {
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--white);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--rust);
      outline: none;
      padding: 0;
    }

    /* ── Link action buttons ──────────────────────────────────────── */
    .link-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
    }
    .lac {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }
    .link-row:hover .lac { opacity: 1; }
    .lac:hover           { color: var(--white); background: var(--b2); }
    .lac.copy-done       { color: var(--green); opacity: 1 !important; }
    .lac.lac-disabled    { opacity: 0.18 !important; cursor: not-allowed; pointer-events: none; }
    .lac.lac-del:hover   { color: var(--rust2); }

    /* ── Empty folder state ───────────────────────────────────────── */
    .folder-empty {
      padding: 14px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--b1);
    }

    /* ── Add Link button row ──────────────────────────────────────── */
    .add-link-bar {
      padding: 6px 12px 8px;
      border-top: 1px solid var(--faint);
    }
    .btn-add-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 2px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .btn-add-link:hover { color: var(--rust2); }

    /* ══════════════════════════════════════════════════════════════════
       PHASE 3 — SEARCH
    ══════════════════════════════════════════════════════════════════ */

    /* ── Search input ─────────────────────────────────────────────── */
    #search-input {
      width: 100%;
      height: 32px;
      padding: 0 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--white);
      background: var(--b1);
      border: 1px solid var(--b2);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #search-input::placeholder { color: var(--muted); font-style: italic; }
    #search-input:focus {
      border-color: var(--rust);
      background: var(--card2);
    }

    /* ── Results dropdown ─────────────────────────────────────────── */
    #search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 150;
      display: none;
      overflow: hidden;
      overflow-y: auto;
      max-height: 320px;
      background: var(--card);
      border: 1px solid var(--b2);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.50);
    }
    #search-dropdown.open { display: block; }

    /* ── Individual result row ────────────────────────────────────── */
    .search-result {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--b1);
      transition: background 0.15s;
    }
    .search-result:last-child { border-bottom: none; }
    .search-result:hover { background: var(--b1); }

    .sr-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Placeholder name when link has no name field */
    .sr-name.sr-unnamed { color: var(--muted); font-style: italic; }

    .sr-meta {
      font-family: 'DM Mono', monospace;
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Empty results state ──────────────────────────────────────── */
    .search-empty {
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      font-style: italic;
    }

    /* ── Link row highlight — fires when navigating to a search result */
    @keyframes link-highlight {
      0%   { background-color: rgba(183,65,14,.30); }
      70%  { background-color: rgba(183,65,14,.14); }
      100% { background-color: transparent; }
    }
    .link-row.search-highlight {
      animation: link-highlight 1.6s ease-out;
    }

    /* ══════════════════════════════════════════════════════════════════
       PHASE 4 — EXPORT / IMPORT + LIGHT MODE TOGGLE
    ══════════════════════════════════════════════════════════════════ */

    /* ── Top-action icon buttons (Export · Import · Theme toggle) ─── */
    .tap-btn {
      display:         flex;
      align-items:     center;
      justify-content: center;
      width:           30px;
      height:          30px;
      border:          1px solid var(--b2);
      background:      var(--card);
      color:           var(--dim);
      border-radius:   6px;
      cursor:          pointer;
      flex-shrink:     0;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .tap-btn:hover {
      color:         var(--white);
      background:    var(--b1);
      border-color:  var(--rust);
    }
  </style>
</head>

<body>

  <!-- ══ TOP BAR ════════════════════════════════════════════════════ -->
  <header id="top-bar">
    <div id="brand">
      <span class="b-url">url</span><span class="b-mgr">mgr</span>
    </div>
    <!-- Phase 3: global search -->
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Search…"
             autocomplete="off" spellcheck="false" aria-label="Search links">
      <div id="search-dropdown" role="listbox" aria-label="Search results"></div>
    </div>
    <!-- Phase 4: import / export / theme toggle -->
    <div id="top-actions"></div>
  </header>

  <!-- ══ MAIN AREA ══════════════════════════════════════════════════ -->
  <main id="main-area"></main>

  <!-- ══ ADD FOLDER BAR (pinned above tab bar) ══════════════════════ -->
  <div id="folder-add-bar">
    <button id="btn-add-folder">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 4.5A1.5 1.5 0 0 1 2.5 3H6l2 2h5.5A1.5 1.5 0 0 1 15 6.5V12A1.5 1.5 0 0 1 13.5 13.5h-11A1.5 1.5 0 0 1 1 12Z"/>
        <line x1="8" y1="7.5" x2="8" y2="11.5"/>
        <line x1="6" y1="9.5" x2="10" y2="9.5"/>
      </svg>
      + Add Folder
    </button>
  </div>

  <!-- ══ SHEET TAB BAR ══════════════════════════════════════════════ -->
  <nav id="tab-bar"></nav>


  <script>
    /* ════════════════════════════════════════════════════════════════════
       URL MANAGER — Phase 1: Shell + Sheets
       localStorage key : urlmanager_v1
       Data model       : see PRD § Data Model
    ════════════════════════════════════════════════════════════════════ */

    // ── Constants ─────────────────────────────────────────────────────
    const LS_KEY = 'urlmanager_v1';

    // ── App state (mutated in-place; persisted on every write) ─────────
    let state  = null;
    let dragId = null;   // ID of the sheet-tab currently being dragged


    /* ──────────────────────────────────────────────────────────────────
       UTILITIES
    ────────────────────────────────────────────────────────────────── */

    /**
     * Generate a PRD-spec ID: prefix + '_' + 8 random [a-z0-9] chars
     * e.g.  uid('sheet')  →  'sheet_a3f7x2kp'
     */
    function uid(prefix) {
      const ch = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let s = prefix + '_';
      for (let i = 0; i < 8; i++) s += ch[Math.floor(Math.random() * ch.length)];
      return s;
    }

    /** Return today as ISO date string: "2026-10-08" */
    function isoToday() {
      const d  = new Date();
      const yy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    /**
     * Format ISO date for display per PRD spec:
     * "2026-10-07"  →  "07 Oct 2026"
     */
    function fmtDate(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-');
      const MON = ['Jan','Feb','Mar','Apr','May','Jun',
                   'Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${d} ${MON[+m - 1] ?? ''} ${y}`;
    }

    /** Escape HTML special chars for safe innerHTML insertion */
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":"&#39;" }[c])
      );
    }


    /* ──────────────────────────────────────────────────────────────────
       PERSISTENCE  ·  localStorage key: urlmanager_v1
    ────────────────────────────────────────────────────────────────── */

    function persist() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
      catch (e) { console.warn('[urlmgr] persist failed', e); }
    }

    function hydrate() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        const p = JSON.parse(raw);
        // Basic shape check before accepting saved data
        return (p?.version && Array.isArray(p?.sheets)) ? p : null;
      } catch (e) {
        console.warn('[urlmgr] hydrate failed', e);
        return null;
      }
    }

    /** Build the initial default state (first-ever load) */
    function newState() {
      const id = uid('sheet');
      return {
        version:  '1.0',
        settings: { theme: 'dark', activeSheetId: id },
        sheets: [{
          id,
          name:         'My Links',
          lastEditDate: isoToday(),
          order:        0,
          folders:      []
        }]
      };
    }


    /* ──────────────────────────────────────────────────────────────────
       SHEET HELPERS
    ────────────────────────────────────────────────────────────────── */

    /** Return sheets sorted by .order ascending */
    const ordered = () => [...state.sheets].sort((a, b) => a.order - b.order);

    /** Return the currently active sheet object, or the first sheet */
    const activeSheet = () =>
      state.sheets.find(s => s.id === state.settings.activeSheetId) ??
      state.sheets[0] ??
      null;

    /** Update a sheet's lastEditDate to today (called on any content change) */
    function touch(id) {
      const s = state.sheets.find(s => s.id === id);
      if (s) s.lastEditDate = isoToday();
    }


    /* ──────────────────────────────────────────────────────────────────
       SHEET CRUD
    ────────────────────────────────────────────────────────────────── */

    function activateSheet(id) {
      state.settings.activeSheetId = id;
      persist();
      renderAll();
    }

    function addSheet(name) {
      name = name.trim();
      if (!name) return;
      const maxOrd = state.sheets.reduce((m, s) => Math.max(m, s.order), -1);
      const sheet  = {
        id:           uid('sheet'),
        name,
        lastEditDate: isoToday(),
        order:        maxOrd + 1,
        folders:      []
      };
      state.sheets.push(sheet);
      state.settings.activeSheetId = sheet.id;
      persist();
      renderAll();
    }

    function renameSheet(id, name) {
      name = name.trim();
      if (!name) return;
      const s = state.sheets.find(s => s.id === id);
      if (!s) return;
      s.name = name;
      touch(id);          // a rename counts as an edit
      persist();
      renderAll();
    }

    function deleteSheet(id) {
      const idx = state.sheets.findIndex(s => s.id === id);
      if (idx < 0) return;

      const sh  = state.sheets[idx];
      const msg = sh.folders.length
        ? `"${esc(sh.name)}" contains folders and links. Delete everything?`
        : `Delete the sheet "${esc(sh.name)}"?`;

      showConfirm('Delete Sheet', msg, () => {
        state.sheets.splice(idx, 1);

        // Always keep at least one sheet
        if (!state.sheets.length) {
          const nid = uid('sheet');
          state.sheets.push({
            id: nid, name: 'My Links',
            lastEditDate: isoToday(), order: 0, folders: []
          });
          state.settings.activeSheetId = nid;
        } else if (state.settings.activeSheetId === id) {
          state.settings.activeSheetId = ordered()[0].id;
        }

        persist();
        renderAll();
      });
    }


    /* ──────────────────────────────────────────────────────────────────
       CONFIRMATION DIALOG
    ────────────────────────────────────────────────────────────────── */

    /**
     * Generic confirmation dialog.
     * opts.okLabel  — label for the confirm button (default: 'Delete')
     * opts.okClass  — CSS class for the confirm button (default: 'btn-danger')
     */
    function showConfirm(title, msg, onOk, opts = {}) {
      const okLabel = opts.okLabel ?? 'Delete';
      const okClass = opts.okClass ?? 'btn-danger';
      const el = document.createElement('div');
      el.className = 'dlg-overlay';
      el.tabIndex  = -1;
      el.innerHTML = `
        <div class="dlg-box" role="dialog" aria-modal="true">
          <div class="dlg-title">${title}</div>
          <div class="dlg-msg">${msg}</div>
          <div class="dlg-actions">
            <button class="btn ${okClass}" data-r="ok">${okLabel}</button>
            <button class="btn btn-ghost"  data-r="cancel">Cancel</button>
          </div>
        </div>`;
      document.body.appendChild(el);
      el.focus();

      const close = () => el.remove();
      el.querySelector('[data-r="cancel"]').onclick = close;
      el.querySelector('[data-r="ok"]').onclick     = () => { close(); onOk(); };
      el.addEventListener('click',   e => { if (e.target === el) close(); });
      el.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    }


    /* ──────────────────────────────────────────────────────────────────
       DRAG-TO-REORDER TABS  ·  HTML5 native drag-and-drop
    ────────────────────────────────────────────────────────────────── */

    function onDragStart(e) {
      dragId = e.currentTarget.dataset.id;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      // Clear previous indicator, set on current target only
      document.querySelectorAll('.sheet-tab.drag-over')
               .forEach(t => t.classList.remove('drag-over'));
      if (e.currentTarget.dataset.id !== dragId)
        e.currentTarget.classList.add('drag-over');
    }

    function onDrop(e) {
      e.preventDefault();
      const src = e.dataTransfer.getData('text/plain');
      const tgt = e.currentTarget.dataset.id;
      if (!src || src === tgt) return;

      const sorted = ordered();
      const si = sorted.findIndex(s => s.id === src);
      const ti = sorted.findIndex(s => s.id === tgt);
      if (si < 0 || ti < 0) return;

      // Splice source out, insert before target
      const [moved] = sorted.splice(si, 1);
      sorted.splice(ti, 0, moved);
      // Re-assign .order to 0, 1, 2 …
      sorted.forEach((s, i) => { s.order = i; });

      persist();
      renderTabs();
    }

    function onDragEnd() {
      document.querySelectorAll('.sheet-tab')
               .forEach(t => t.classList.remove('dragging', 'drag-over'));
      dragId = null;
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — SVG ICON STRINGS
    ══════════════════════════════════════════════════════════════════ */

    const SVG_CHEVRON = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="2 4 6 8 10 4"/></svg>`;

    const SVG_DOTS = `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
      <circle cx="3.5" cy="2.5" r="1.1"/><circle cx="3.5" cy="6" r="1.1"/>
      <circle cx="3.5" cy="9.5" r="1.1"/><circle cx="8.5" cy="2.5" r="1.1"/>
      <circle cx="8.5" cy="6" r="1.1"/><circle cx="8.5" cy="9.5" r="1.1"/></svg>`;

    const SVG_TRASH = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 5 13 5"/>
      <path d="M6 5V3h4v2"/>
      <path d="M5 5l.9 8.5h4.2L11 5"/></svg>`;

    const SVG_COPY = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="5" width="8" height="9" rx="1.5"/>
      <path d="M10 5V3.5A1.5 1.5 0 0 0 8.5 2H4A1.5 1.5 0 0 0 2.5 3.5V10A1.5 1.5 0 0 0 4 11.5H5"/></svg>`;

    const SVG_CHECK = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="2 8 6 12 14 4"/></svg>`;

    const SVG_PLUS = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"
      stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="6" y1="1" x2="6" y2="11"/>
      <line x1="1" y1="6" x2="11" y2="6"/></svg>`;

    /* ── Phase 4 icons ──────────────────────────────────────────── */

    /** Sun — shown in dark mode; click switches to light */
    const SVG_SUN = `<svg width="15" height="15" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="2.8"/>
      <line x1="8" y1="1"    x2="8"    y2="2.6"/>
      <line x1="8" y1="13.4" x2="8"    y2="15"/>
      <line x1="1"    y1="8" x2="2.6"  y2="8"/>
      <line x1="13.4" y1="8" x2="15"   y2="8"/>
      <line x1="3.1"  y1="3.1"  x2="4.2"  y2="4.2"/>
      <line x1="11.8" y1="11.8" x2="12.9" y2="12.9"/>
      <line x1="12.9" y1="3.1"  x2="11.8" y2="4.2"/>
      <line x1="4.2"  y1="11.8" x2="3.1"  y2="12.9"/>
    </svg>`;

    /** Moon — shown in light mode; click switches to dark */
    const SVG_MOON = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6.1 6.1 0 1 0 8 8Z"/>
    </svg>`;

    /** Export / download */
    const SVG_EXPORT = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 11v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2"/>
      <polyline points="5 7.5 8 10.5 11 7.5"/>
      <line x1="8" y1="2" x2="8" y2="10.5"/>
    </svg>`;

    /** Import / upload */
    const SVG_IMPORT = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 11v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2"/>
      <polyline points="5 5 8 2 11 5"/>
      <line x1="8" y1="2" x2="8" y2="10.5"/>
    </svg>`;


    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — FOLDER CRUD
    ══════════════════════════════════════════════════════════════════ */

    function addFolder() {
      const sh = activeSheet();
      if (!sh) return;
      const maxOrd = sh.folders.reduce((m, f) => Math.max(m, f.order), -1);
      const fo = {
        id:        uid('folder'),
        name:      'New Folder',
        collapsed: false,
        order:     maxOrd + 1,
        links:     []
      };
      sh.folders.push(fo);
      touch(sh.id);
      persist();
      renderMain();
      renderTabs();
      // Auto-open inline rename on the just-created folder
      setTimeout(() => {
        const card = document.querySelector(`.folder-card[data-fid="${fo.id}"]`);
        if (!card) return;
        const nm = card.querySelector('.folder-name');
        if (nm) startFolderRename(card, sh.id, fo.id, nm);
      }, 20);
    }

    function renameFolder(sheetId, folderId, name) {
      name = name.trim();
      if (!name) return;
      const sh = state.sheets.find(s => s.id === sheetId);
      const fo = sh && sh.folders.find(f => f.id === folderId);
      if (!fo) return;
      fo.name = name;
      touch(sheetId);
      persist();
      renderTabs();
    }

    function deleteFolder(sheetId, folderId) {
      const sh = state.sheets.find(s => s.id === sheetId);
      const fo = sh && sh.folders.find(f => f.id === folderId);
      if (!sh || !fo) return;
      const hasLinks = fo.links.length > 0;
      const msg = hasLinks
        ? `"${esc(fo.name)}" contains ${fo.links.length} link${fo.links.length !== 1 ? 's' : ''}. Delete everything?`
        : `Delete the folder "${esc(fo.name)}"?`;
      showConfirm('Delete Folder', msg, () => {
        sh.folders = sh.folders.filter(f => f.id !== folderId);
        touch(sheetId);
        persist();
        renderMain();
        renderTabs();
      });
    }

    function toggleFolder(sheetId, folderId) {
      const sh = state.sheets.find(s => s.id === sheetId);
      const fo = sh && sh.folders.find(f => f.id === folderId);
      if (!fo) return;
      fo.collapsed = !fo.collapsed;
      persist();
      // Toggle CSS class directly — no full re-render needed
      const card = document.querySelector(`.folder-card[data-fid="${folderId}"]`);
      if (card) card.classList.toggle('collapsed', fo.collapsed);
    }

    /* Inline rename for folder name — replaces span with input in place */
    function startFolderRename(card, sheetId, folderId, nmEl) {
      if (card.querySelector('.folder-rename-inp')) return;
      const inp = document.createElement('input');
      inp.type      = 'text';
      inp.className = 'folder-rename-inp';
      inp.value     = nmEl.textContent;
      nmEl.replaceWith(inp);
      inp.focus();
      inp.select();
      let done = false;
      const commit = () => {
        if (done) return; done = true;
        const val = inp.value.trim() || nmEl.textContent;
        renameFolder(sheetId, folderId, val);
        inp.replaceWith(nmEl);
        nmEl.textContent = val;
      };
      const cancel = () => {
        if (done) return; done = true;
        inp.replaceWith(nmEl);
      };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter')  { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — LINK CRUD
    ══════════════════════════════════════════════════════════════════ */

    function addLink(sheetId, folderId) {
      const sh = state.sheets.find(s => s.id === sheetId);
      const fo = sh && sh.folders.find(f => f.id === folderId);
      if (!fo) return;
      const maxOrd = fo.links.reduce((m, l) => Math.max(m, l.order), -1);
      const lk = { id: uid('link'), name: '', url: '', description: '', order: maxOrd + 1 };
      fo.links.push(lk);
      touch(sheetId);
      persist();
      renderMain();
      renderTabs();
      // Auto-focus the Name cell of the new row
      setTimeout(() => {
        const row = document.querySelector(`.link-row[data-lid="${lk.id}"]`);
        const cell = row && row.querySelector('.link-cell[data-field="name"]');
        if (cell) startCellEdit(cell, sheetId, folderId, lk.id, 'name');
      }, 20);
    }

    function updateLink(sheetId, folderId, linkId, field, value) {
      const sh = state.sheets.find(s => s.id === sheetId);
      const fo = sh && sh.folders.find(f => f.id === folderId);
      const lk = fo && fo.links.find(l => l.id === linkId);
      if (!lk) return;
      lk[field] = value;
      touch(sheetId);
      persist();
      // Patch the single cell in the DOM instead of full re-render
      const row  = document.querySelector(`.link-row[data-lid="${linkId}"]`);
      const cell = row && row.querySelector(`.link-cell[data-field="${field}"]`);
      if (cell) renderCellDisplay(cell, field, value);
      // If URL changed, sync the copy button's disabled state
      if (field === 'url') {
        const copyBtn = row && row.querySelector('.lac-copy');
        if (copyBtn) {
          const hasUrl = !!value;
          copyBtn.classList.toggle('lac-disabled', !hasUrl);
          copyBtn.title = hasUrl ? 'Copy URL' : 'No URL to copy';
        }
      }
      renderTabs();   // refresh last-edit date on tab
    }

    function deleteLink(sheetId, folderId, linkId) {
      const sh = state.sheets.find(s => s.id === sheetId);
      const fo = sh && sh.folders.find(f => f.id === folderId);
      const lk = fo && fo.links.find(l => l.id === linkId);
      if (!lk) return;
      const label = lk.name ? `"${esc(lk.name)}"` : 'This link';
      showConfirm('Delete Link', `${label} will be permanently removed.`, () => {
        fo.links = fo.links.filter(l => l.id !== linkId);
        touch(sheetId);
        persist();
        renderMain();
        renderTabs();
      });
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — CELL DISPLAY + INLINE EDITING
    ══════════════════════════════════════════════════════════════════ */

    /* Render the display-mode content of a single link cell */
    function renderCellDisplay(cell, field, value) {
      cell.innerHTML = '';
      const inner = document.createElement('div');
      inner.className = 'lc-inner' + (value ? '' : ' ph');
      if (field === 'url' && value) {
        const a       = document.createElement('a');
        a.href        = value;
        a.target      = '_blank';
        a.rel         = 'noopener noreferrer';
        a.textContent = value;
        // Clicking the link should not trigger cell edit
        a.addEventListener('click', e => e.stopPropagation());
        inner.appendChild(a);
      } else {
        inner.textContent = value || (field === 'name' ? 'Name…'
                          : field === 'url'  ? 'https://…'
                          :                    'Description…');
      }
      cell.appendChild(inner);
    }

    /* Replace cell content with an input for inline editing */
    function startCellEdit(cell, sheetId, folderId, linkId, field) {
      if (cell.querySelector('.link-cell-inp')) return;  // already editing
      const sh = state.sheets.find(s => s.id === sheetId);
      const fo = sh  && sh.folders.find(f => f.id === folderId);
      const lk = fo  && fo.links.find(l => l.id === linkId);
      if (!lk) return;

      const original = lk[field] || '';
      cell.innerHTML = '';
      const inp = document.createElement('input');
      inp.type      = 'text';
      inp.className = 'link-cell-inp';
      inp.value     = original;
      cell.appendChild(inp);
      inp.focus();
      inp.select();

      let done = false;
      const commit = () => {
        if (done) return; done = true;
        updateLink(sheetId, folderId, linkId, field, inp.value.trim());
      };
      const cancel = () => {
        if (done) return; done = true;
        renderCellDisplay(cell, field, original);
      };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter')  { e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); inp.removeEventListener('blur', commit); cancel(); }
      });
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — CLIPBOARD COPY
    ══════════════════════════════════════════════════════════════════ */

    function copyToClipboard(text, btn) {
      const showDone = () => {
        btn.classList.add('copy-done');
        btn.innerHTML = SVG_CHECK;
        setTimeout(() => {
          btn.classList.remove('copy-done');
          btn.innerHTML = SVG_COPY;
        }, 1500);
      };
      // Fallback for non-HTTPS contexts (local file:// dev)
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        ta.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showDone).catch(() => { fallback(); showDone(); });
      } else {
        fallback();
        showDone();
      }
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — DRAG-TO-REORDER: FOLDERS
    ══════════════════════════════════════════════════════════════════ */

    let folderDragId = null;
    let folderDragSheetId = null;

    function onFolderDragStart(e, sheetId, folderId) {
      folderDragId      = folderId;
      folderDragSheetId = sheetId;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', folderId);
      e.stopPropagation();
    }

    function onFolderDragOver(e, card) {
      if (!folderDragId || folderDragId === card.dataset.fid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.folder-card')
               .forEach(c => c.classList.remove('folder-drag-over'));
      card.classList.add('folder-drag-over');
    }

    function onFolderDrop(e, sheetId, targetFolderId) {
      e.preventDefault();
      document.querySelectorAll('.folder-card')
               .forEach(c => c.classList.remove('folder-drag-over'));
      if (!folderDragId || folderDragId === targetFolderId || folderDragSheetId !== sheetId) return;
      const sh  = state.sheets.find(s => s.id === sheetId);
      if (!sh) return;
      const sorted = [...sh.folders].sort((a, b) => a.order - b.order);
      const si     = sorted.findIndex(f => f.id === folderDragId);
      const ti     = sorted.findIndex(f => f.id === targetFolderId);
      if (si < 0 || ti < 0) return;
      const [moved] = sorted.splice(si, 1);
      sorted.splice(ti, 0, moved);
      sorted.forEach((f, i) => { f.order = i; });
      folderDragId = null;
      persist();
      renderMain();
    }

    function onFolderDragEnd() {
      document.querySelectorAll('.folder-card')
               .forEach(c => c.classList.remove('folder-drag-over'));
      folderDragId = null;
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — DRAG-TO-REORDER: LINKS
    ══════════════════════════════════════════════════════════════════ */

    let linkDragId       = null;
    let linkDragFolderId = null;

    let searchTimer = null;    // Phase 3: debounce handle for search input

    function onLinkDragStart(e, folderId, linkId) {
      linkDragId       = linkId;
      linkDragFolderId = folderId;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', linkId);
      e.stopPropagation();
    }

    function onLinkDragOver(e, row, folderId) {
      if (!linkDragId || linkDragId === row.dataset.lid || linkDragFolderId !== folderId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.link-row')
               .forEach(r => r.classList.remove('link-drag-over'));
      row.classList.add('link-drag-over');
    }

    function onLinkDrop(e, sheetId, folderId, targetLinkId) {
      e.preventDefault();
      document.querySelectorAll('.link-row')
               .forEach(r => r.classList.remove('link-drag-over'));
      if (!linkDragId || linkDragId === targetLinkId || linkDragFolderId !== folderId) return;
      const sh  = state.sheets.find(s => s.id === sheetId);
      const fo  = sh && sh.folders.find(f => f.id === folderId);
      if (!fo) return;
      const sorted = [...fo.links].sort((a, b) => a.order - b.order);
      const si     = sorted.findIndex(l => l.id === linkDragId);
      const ti     = sorted.findIndex(l => l.id === targetLinkId);
      if (si < 0 || ti < 0) return;
      const [moved] = sorted.splice(si, 1);
      sorted.splice(ti, 0, moved);
      sorted.forEach((l, i) => { l.order = i; });
      linkDragId = null;
      persist();
      renderMain();
    }

    function onLinkDragEnd() {
      document.querySelectorAll('.link-row')
               .forEach(r => r.classList.remove('link-drag-over'));
      linkDragId = null;
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 2 — BUILD LINK ROW DOM
    ══════════════════════════════════════════════════════════════════ */

    function buildLinkRow(sheetId, folderId, lk) {
      const row       = document.createElement('div');
      row.className   = 'link-row';
      row.dataset.lid = lk.id;
      row.draggable   = false;

      // ── Drag handle
      const dh     = document.createElement('div');
      dh.className = 'link-drag-hdl';
      dh.innerHTML = SVG_DOTS;
      dh.title     = 'Drag to reorder';
      dh.addEventListener('mousedown', () => { row.draggable = true; });
      dh.addEventListener('mouseup',   () => { row.draggable = false; });

      // ── Name cell
      const nmCell            = document.createElement('div');
      nmCell.className        = 'link-cell';
      nmCell.dataset.field    = 'name';
      renderCellDisplay(nmCell, 'name', lk.name);

      // ── URL cell
      const urlCell           = document.createElement('div');
      urlCell.className       = 'link-cell';
      urlCell.dataset.field   = 'url';
      renderCellDisplay(urlCell, 'url', lk.url);

      // ── Description cell
      const descCell          = document.createElement('div');
      descCell.className      = 'link-cell';
      descCell.dataset.field  = 'description';
      renderCellDisplay(descCell, 'description', lk.description);

      // ── Actions column
      const actions       = document.createElement('div');
      actions.className   = 'link-actions';

      const copyBtn       = document.createElement('button');
      copyBtn.className   = 'lac lac-copy' + (lk.url ? '' : ' lac-disabled');
      copyBtn.title       = lk.url ? 'Copy URL' : 'No URL to copy';
      copyBtn.innerHTML   = SVG_COPY;
      copyBtn.addEventListener('click', e => {
        e.stopPropagation();
        // Re-read from live state so we get latest URL even if edited after row was built
        const sh2 = state.sheets.find(s => s.id === sheetId);
        const fo2 = sh2 && sh2.folders.find(f => f.id === folderId);
        const lk2 = fo2 && fo2.links.find(l => l.id === lk.id);
        if (!lk2 || !lk2.url) return;
        copyToClipboard(lk2.url, copyBtn);
      });

      const delBtn        = document.createElement('button');
      delBtn.className    = 'lac lac-del';
      delBtn.title        = 'Delete link';
      delBtn.innerHTML    = SVG_TRASH;
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        deleteLink(sheetId, folderId, lk.id);
      });

      actions.appendChild(copyBtn);
      actions.appendChild(delBtn);

      // ── Click any cell → edit
      [nmCell, urlCell, descCell].forEach(cell => {
        cell.addEventListener('click', () =>
          startCellEdit(cell, sheetId, folderId, lk.id, cell.dataset.field)
        );
      });

      // ── Drag-to-reorder wiring
      row.addEventListener('dragstart', e => onLinkDragStart(e, folderId, lk.id));
      row.addEventListener('dragover',  e => onLinkDragOver(e, row, folderId));
      row.addEventListener('drop',      e => onLinkDrop(e, sheetId, folderId, lk.id));
      row.addEventListener('dragend',   onLinkDragEnd);

      row.append(dh, nmCell, urlCell, descCell, actions);
      return row;
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 3 — SEARCH
    ══════════════════════════════════════════════════════════════════ */

    /**
     * Search across all sheets, folders, and links for the given query string.
     * Matches link name, url, and description fields (case-insensitive).
     * Returns an array of result objects.
     */
    function performSearch(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const results = [];
      state.sheets.forEach(sheet => {
        sheet.folders.forEach(folder => {
          folder.links.forEach(link => {
            const hit =
              (link.name        && link.name.toLowerCase().includes(q))        ||
              (link.url         && link.url.toLowerCase().includes(q))         ||
              (link.description && link.description.toLowerCase().includes(q));
            if (hit) {
              results.push({
                sheetId:    sheet.id,
                sheetName:  sheet.name,
                folderId:   folder.id,
                folderName: folder.name,
                linkId:     link.id,
                linkName:   link.name,   // may be empty string
                linkUrl:    link.url,
              });
            }
          });
        });
      });
      return results;
    }

    /** Build and open the results dropdown for the given query + results array */
    function showSearchDropdown(results, query) {
      const dd = document.getElementById('search-dropdown');
      dd.innerHTML = '';

      if (!results.length) {
        const empty     = document.createElement('div');
        empty.className = 'search-empty';
        // PRD exact copy: No results for "[query]"
        empty.textContent = `No results for "${query}"`;
        dd.appendChild(empty);
      } else {
        results.forEach(r => {
          const item     = document.createElement('div');
          item.className = 'search-result';
          item.setAttribute('role', 'option');

          // Link name — fall back to URL, then "(unnamed)" if both empty
          const nameEl     = document.createElement('div');
          const display    = r.linkName || r.linkUrl;
          nameEl.className = 'sr-name' + (display ? '' : ' sr-unnamed');
          nameEl.textContent = display || '(unnamed link)';

          // Sheet / Folder breadcrumb
          const metaEl     = document.createElement('div');
          metaEl.className = 'sr-meta';
          metaEl.textContent = `${r.sheetName} / ${r.folderName}`;

          item.append(nameEl, metaEl);

          // Click: close search first, then navigate
          item.addEventListener('click', () => {
            closeSearch();
            navigateToResult(r);
          });

          dd.appendChild(item);
        });
      }

      dd.classList.add('open');
    }

    /**
     * Clear the search input and close the results dropdown.
     * Called when a result is selected or Escape is pressed.
     */
    function closeSearch() {
      const inp = document.getElementById('search-input');
      const dd  = document.getElementById('search-dropdown');
      if (inp) inp.value = '';
      if (dd)  dd.classList.remove('open');
    }

    /**
     * Close the results dropdown without clearing the input.
     * Called when clicking outside the search wrap.
     */
    function collapseDropdown() {
      const dd = document.getElementById('search-dropdown');
      if (dd) dd.classList.remove('open');
    }

    /**
     * Switch to the result's sheet (if needed), expand its folder (if collapsed),
     * then scroll to and briefly highlight the link row.
     */
    function navigateToResult(result) {
      // Switch sheet if this result belongs to a different one
      if (state.settings.activeSheetId !== result.sheetId) {
        state.settings.activeSheetId = result.sheetId;
      }

      // Ensure the containing folder is expanded so the row is visible
      const sh = state.sheets.find(s => s.id === result.sheetId);
      const fo = sh && sh.folders.find(f => f.id === result.folderId);
      if (fo && fo.collapsed) {
        fo.collapsed = false;
      }

      // Persist state + re-render (always safe — handles both sheet switch and uncollapse)
      persist();
      renderAll();

      // After the DOM is updated, scroll to the row and flash the highlight
      // setTimeout 20ms gives the browser one paint cycle to complete the render
      setTimeout(() => {
        const row = document.querySelector(`.link-row[data-lid="${result.linkId}"]`);
        if (!row) return;
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        // Remove any existing highlight class first (edge case: repeated searches)
        row.classList.remove('search-highlight');
        // Force reflow so re-adding the class re-triggers the animation
        void row.offsetWidth;
        row.classList.add('search-highlight');
        row.addEventListener('animationend', () => {
          row.classList.remove('search-highlight');
        }, { once: true });
      }, 20);
    }


    /* ══════════════════════════════════════════════════════════════════
       PHASE 4 — EXPORT / IMPORT + LIGHT MODE
    ══════════════════════════════════════════════════════════════════ */

    /* ── Export ──────────────────────────────────────────────────────
       Serialises the full state object to a dated JSON file and
       triggers a browser download. No server involved — Blob + anchor.
    ────────────────────────────────────────────────────────────────── */
    function exportData() {
      const filename = `url-manager-${isoToday()}.json`;
      const payload  = JSON.stringify(state, null, 2);
      const blob     = new Blob([payload], { type: 'application/json' });
      const url      = URL.createObjectURL(blob);
      const a        = document.createElement('a');
      a.href         = url;
      a.download     = filename;
      a.style.cssText = 'display:none;position:fixed;';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }


    /* ── Import ──────────────────────────────────────────────────────
       Opens a .json file picker.  On selection: validates JSON and
       shape, shows a confirmation dialog, then replaces state on
       confirm.  Invalid files show an error and leave state untouched.
    ────────────────────────────────────────────────────────────────── */
    function importData() {
      const input     = document.createElement('input');
      input.type      = 'file';
      input.accept    = '.json';
      input.style.cssText = 'display:none;position:fixed;';
      document.body.appendChild(input);

      // Clean up if the user dismisses the picker without choosing a file
      input.addEventListener('cancel', () => input.remove());

      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        input.remove();
        if (!file) return;

        const reader = new FileReader();

        reader.onload = (evt) => {
          // ── Step 1: Parse JSON ──────────────────────────────────
          let parsed;
          try {
            parsed = JSON.parse(evt.target.result);
          } catch {
            showImportError('This file is not valid JSON. No changes were made.');
            return;
          }

          // ── Step 2: Shape validation ───────────────────────────
          if (
            !parsed                         ||
            typeof parsed !== 'object'      ||
            !parsed.version                 ||
            !Array.isArray(parsed.sheets)
          ) {
            showImportError(
              'This file doesn\'t look like a URL Manager backup. ' +
              'No changes were made.'
            );
            return;
          }

          // ── Step 3: Confirmation dialog ────────────────────────
          showConfirm(
            'Import Data',
            'This will replace <strong>all current data</strong> with the ' +
            'contents of the imported file. This cannot be undone.',
            () => {
              // Apply the imported state
              state = parsed;

              // Ensure settings object is complete
              if (!state.settings || typeof state.settings !== 'object') {
                state.settings = {};
              }
              if (!state.settings.theme) state.settings.theme = 'dark';

              // Phase 2 migration: add any missing fields so the app
              // won't crash on older or partially-formed backup files
              state.sheets.forEach((sh, si) => {
                if (typeof sh.order       === 'undefined') sh.order   = si;
                if (!Array.isArray(sh.folders)) sh.folders = [];
                sh.folders.forEach((fo, fi) => {
                  if (typeof fo.collapsed !== 'boolean')  fo.collapsed = false;
                  if (typeof fo.order     === 'undefined') fo.order    = fi;
                  if (!Array.isArray(fo.links)) fo.links = [];
                  fo.links.forEach((lk, li) => {
                    if (typeof lk.name        === 'undefined') lk.name        = '';
                    if (typeof lk.url         === 'undefined') lk.url         = '';
                    if (typeof lk.description === 'undefined') lk.description = '';
                    if (typeof lk.order       === 'undefined') lk.order       = li;
                  });
                });
              });

              // Validate activeSheetId still points to a real sheet
              if (!state.sheets.find(s => s.id === state.settings.activeSheetId)) {
                const first = [...state.sheets].sort((a, b) => a.order - b.order)[0];
                state.settings.activeSheetId = first ? first.id : '';
              }

              // Apply the imported file's theme
              const nowLight = state.settings.theme === 'light';
              document.body.classList.toggle('light', nowLight);
              // Sync the theme button icon
              const themeBtn = document.getElementById('btn-theme');
              if (themeBtn) {
                themeBtn.innerHTML = nowLight ? SVG_MOON : SVG_SUN;
                themeBtn.title     = nowLight
                  ? 'Switch to dark mode'
                  : 'Switch to light mode';
              }

              persist();
              renderAll();
            },
            { okLabel: 'Replace Data', okClass: 'btn-danger' }
          );
        };

        reader.onerror = () => {
          showImportError('Could not read the file. No changes were made.');
        };

        reader.readAsText(file);
      });

      input.click();
    }


    /* ── Import error dialog ─────────────────────────────────────────
       Single-button (OK) dialog — used only for import failures.
       State is never modified before this dialog is shown.
    ────────────────────────────────────────────────────────────────── */
    function showImportError(msg) {
      const el = document.createElement('div');
      el.className = 'dlg-overlay';
      el.tabIndex  = -1;
      el.innerHTML = `
        <div class="dlg-box" role="alertdialog" aria-modal="true">
          <div class="dlg-title">Import Error</div>
          <div class="dlg-msg">${esc(msg)}</div>
          <div class="dlg-actions">
            <button class="btn btn-ghost" data-r="ok">OK</button>
          </div>
        </div>`;
      document.body.appendChild(el);
      el.focus();
      const close = () => el.remove();
      el.querySelector('[data-r="ok"]').onclick = close;
      el.addEventListener('click',   e => { if (e.target === el) close(); });
      el.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    }


    /* ── Theme toggle ────────────────────────────────────────────────
       Toggles body.light, saves preference to state.settings.theme,
       persists, and updates the button icon.
       The 0.2s colour transition declared on body/#top-bar/#main-area/
       #tab-bar in Phase 1 CSS handles the visual handoff.
    ────────────────────────────────────────────────────────────────── */
    function toggleTheme() {
      const isNowLight = document.body.classList.toggle('light');
      state.settings.theme = isNowLight ? 'light' : 'dark';
      persist();
      const btn = document.getElementById('btn-theme');
      if (!btn) return;
      btn.innerHTML = isNowLight ? SVG_MOON : SVG_SUN;
      btn.title     = isNowLight ? 'Switch to dark mode' : 'Switch to light mode';
    }


    /* ── Build top-action buttons ────────────────────────────────────
       Called once from init, after the saved theme is applied so the
       theme button renders the correct initial icon.
    ────────────────────────────────────────────────────────────────── */
    function initTopActions() {
      const bar = document.getElementById('top-actions');
      bar.innerHTML = '';

      // Export button
      const expBtn       = document.createElement('button');
      expBtn.id          = 'btn-export';
      expBtn.className   = 'tap-btn';
      expBtn.title       = 'Export data as JSON';
      expBtn.innerHTML   = SVG_EXPORT;
      expBtn.addEventListener('click', exportData);

      // Import button
      const impBtn       = document.createElement('button');
      impBtn.id          = 'btn-import';
      impBtn.className   = 'tap-btn';
      impBtn.title       = 'Import data from JSON';
      impBtn.innerHTML   = SVG_IMPORT;
      impBtn.addEventListener('click', importData);

      // Theme toggle — icon reflects current theme at init time
      const themeBtn     = document.createElement('button');
      themeBtn.id        = 'btn-theme';
      themeBtn.className = 'tap-btn';
      const startsLight  = document.body.classList.contains('light');
      themeBtn.innerHTML = startsLight ? SVG_MOON : SVG_SUN;
      themeBtn.title     = startsLight ? 'Switch to dark mode' : 'Switch to light mode';
      themeBtn.addEventListener('click', toggleTheme);

      bar.append(expBtn, impBtn, themeBtn);
    }


    /* ──────────────────────────────────────────────────────────────────
       RENDER — MAIN AREA
    ────────────────────────────────────────────────────────────────── */

    function renderMain() {
      const area  = document.getElementById('main-area');
      const sheet = activeSheet();

      if (!sheet) {
        area.innerHTML = `<div class="empty-state"><span>No sheets found.</span></div>`;
        return;
      }

      if (!sheet.folders.length) {
        area.innerHTML = `
          <div class="empty-state">
            <svg width="54" height="54" viewBox="0 0 54 54" fill="none"
                 color="var(--muted)" aria-hidden="true">
              <path d="M7 44V20a2 2 0 0 1 2-2h13l4.5 4.5H47a2 2 0 0 1 2 2v19.5a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2Z"
                    stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
              <path d="M27 30.5v9M22.5 35h9"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>No folders yet — click <strong>+ Add Folder</strong> to get started</span>
          </div>`;
        return;
      }

      // ── Build folder list ────────────────────────────────────────
      const list   = document.createElement('div');
      list.id      = 'folder-list';
      const folders = [...sheet.folders].sort((a, b) => a.order - b.order);

      folders.forEach(fo => {
        const links = [...fo.links].sort((a, b) => a.order - b.order);

        // ── Folder card ──────────────────────────────────────────
        const card     = document.createElement('div');
        card.className = 'folder-card' + (fo.collapsed ? ' collapsed' : '');
        card.dataset.fid = fo.id;
        card.draggable   = false;

        // ── Folder header ────────────────────────────────────────
        const hdr     = document.createElement('div');
        hdr.className = 'folder-header';

        const chevron     = document.createElement('span');
        chevron.className = 'folder-chevron';
        chevron.innerHTML = SVG_CHEVRON;

        const nmEl     = document.createElement('span');
        nmEl.className = 'folder-name';
        nmEl.textContent = fo.name;

        const badge     = document.createElement('span');
        badge.className = 'folder-badge';
        badge.textContent = links.length;

        const dragHdl     = document.createElement('span');
        dragHdl.className = 'folder-drag-hdl';
        dragHdl.innerHTML = SVG_DOTS;
        dragHdl.title     = 'Drag to reorder';
        // Drag handle: set card draggable only while handle is held
        dragHdl.addEventListener('mousedown', () => { card.draggable = true; });
        dragHdl.addEventListener('mouseup',   () => { card.draggable = false; });

        const delBtn     = document.createElement('button');
        delBtn.className = 'folder-del';
        delBtn.title     = 'Delete folder';
        delBtn.innerHTML = SVG_TRASH;

        hdr.append(chevron, nmEl, badge, dragHdl, delBtn);

        // Header click → collapse/expand (ignore clicks on interactive children)
        hdr.addEventListener('click', e => {
          if (e.target.closest('.folder-del') ||
              e.target.closest('.folder-drag-hdl') ||
              e.target.closest('.folder-rename-inp')) return;
          toggleFolder(sheet.id, fo.id);
        });

        // Double-click name → inline rename
        nmEl.addEventListener('dblclick', e => {
          e.stopPropagation();
          startFolderRename(card, sheet.id, fo.id, nmEl);
        });

        // Delete button
        delBtn.addEventListener('click', e => {
          e.stopPropagation();
          deleteFolder(sheet.id, fo.id);
        });

        // Folder drag-to-reorder wiring
        card.addEventListener('dragstart', e => onFolderDragStart(e, sheet.id, fo.id));
        card.addEventListener('dragover',  e => onFolderDragOver(e, card));
        card.addEventListener('drop',      e => onFolderDrop(e, sheet.id, fo.id));
        card.addEventListener('dragend',   onFolderDragEnd);
        // Reset draggable when mouse leaves so accidental drags don't fire
        card.addEventListener('dragend', () => { card.draggable = false; });

        // ── Folder body ──────────────────────────────────────────
        const body     = document.createElement('div');
        body.className = 'folder-body';

        if (links.length > 0) {
          // Column header
          const colHdr     = document.createElement('div');
          colHdr.className = 'link-col-hdr';
          colHdr.innerHTML = `
            <span></span>
            <span>Name</span>
            <span>URL</span>
            <span>Description</span>
            <span></span>`;
          body.appendChild(colHdr);

          // Link rows wrapper (needed for :last-child border removal)
          const rowsWrap     = document.createElement('div');
          rowsWrap.className = 'link-rows-wrap';
          links.forEach(lk => rowsWrap.appendChild(buildLinkRow(sheet.id, fo.id, lk)));
          body.appendChild(rowsWrap);
        } else {
          const empty     = document.createElement('div');
          empty.className = 'folder-empty';
          empty.textContent = 'No links yet — click + Add Link below';
          body.appendChild(empty);
        }

        // Add Link button
        const alBar     = document.createElement('div');
        alBar.className = 'add-link-bar';
        const alBtn     = document.createElement('button');
        alBtn.className = 'btn-add-link';
        alBtn.innerHTML = SVG_PLUS + ' + Add Link';
        alBtn.addEventListener('click', () => addLink(sheet.id, fo.id));
        alBar.appendChild(alBtn);
        body.appendChild(alBar);

        card.append(hdr, body);
        list.appendChild(card);
      });

      area.innerHTML = '';
      area.appendChild(list);
    }


    /* ──────────────────────────────────────────────────────────────────
       RENDER — TAB BAR
    ────────────────────────────────────────────────────────────────── */

    function renderTabs() {
      const bar = document.getElementById('tab-bar');
      bar.innerHTML = '';

      ordered().forEach(sheet => {
        const tab = document.createElement('div');
        tab.className  = 'sheet-tab' + (sheet.id === state.settings.activeSheetId ? ' active' : '');
        tab.dataset.id = sheet.id;
        tab.draggable  = true;

        // Name
        const nm = document.createElement('span');
        nm.className   = 'tab-name';
        nm.textContent = sheet.name;

        // Last edit date
        const dt = document.createElement('span');
        dt.className   = 'tab-date';
        dt.textContent = fmtDate(sheet.lastEditDate);

        // Delete ✕
        const del = document.createElement('span');
        del.className   = 'tab-del';
        del.title       = 'Delete sheet';
        del.textContent = '✕';

        tab.append(nm, dt, del);

        // Click → activate
        tab.addEventListener('click', e => {
          if (e.target === del) return;
          if (tab.querySelector('.tab-rename-input')) return;
          activateSheet(sheet.id);
        });

        // Double-click → rename inline
        tab.addEventListener('dblclick', e => {
          if (e.target === del) return;
          startRename(tab, sheet, nm);
        });

        // ✕ → delete with confirmation
        del.addEventListener('click', e => {
          e.stopPropagation();
          deleteSheet(sheet.id);
        });

        // Drag-to-reorder
        tab.addEventListener('dragstart', onDragStart);
        tab.addEventListener('dragover',  onDragOver);
        tab.addEventListener('drop',      onDrop);
        tab.addEventListener('dragend',   onDragEnd);

        bar.appendChild(tab);
      });

      // ── + New sheet button ──────────────────────────────────────
      const plus = document.createElement('div');
      plus.id          = 'tab-add';
      plus.title       = 'New sheet';
      plus.textContent = '+';
      plus.addEventListener('click', startCreate);
      bar.appendChild(plus);
    }


    /* ──────────────────────────────────────────────────────────────────
       INLINE RENAME  ·  double-click on tab name
    ────────────────────────────────────────────────────────────────── */

    function startRename(tab, sheet, nm) {
      if (tab.querySelector('.tab-rename-input')) return;  // already renaming

      const inp = document.createElement('input');
      inp.type      = 'text';
      inp.className = 'tab-rename-input';
      inp.value     = sheet.name;
      nm.replaceWith(inp);
      inp.focus();
      inp.select();

      let done = false;
      const commit = () => {
        if (done) return; done = true;
        renameSheet(sheet.id, inp.value.trim() || sheet.name);
      };
      const cancel = () => {
        if (done) return; done = true;
        renderTabs();
      };

      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter')  { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
    }


    /* ──────────────────────────────────────────────────────────────────
       INLINE CREATE  ·  click + button
    ────────────────────────────────────────────────────────────────── */

    function startCreate() {
      const bar  = document.getElementById('tab-bar');
      const plus = document.getElementById('tab-add');
      if (bar.querySelector('.tab-create-input')) return;  // already open

      const inp = document.createElement('input');
      inp.type        = 'text';
      inp.className   = 'tab-create-input';
      inp.placeholder = 'Sheet name…';
      inp.maxLength   = 48;
      bar.insertBefore(inp, plus);
      inp.focus();

      let done = false;
      const commit = () => {
        if (done) return; done = true;
        const v = inp.value.trim();
        if (v) addSheet(v);
        else   { inp.remove(); renderTabs(); }
      };
      const cancel = () => {
        if (done) return; done = true;
        inp.remove();
        renderTabs();
      };

      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter')  { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
    }


    /* ──────────────────────────────────────────────────────────────────
       RENDER ALL
    ────────────────────────────────────────────────────────────────── */

    function renderAll() {
      renderTabs();
      renderMain();
    }


    /* ──────────────────────────────────────────────────────────────────
       INIT
    ────────────────────────────────────────────────────────────────── */

    (function init() {
      // Load saved data or bootstrap with defaults
      state = hydrate() ?? newState();

      // Guard: make sure activeSheetId points to a real sheet
      if (!state.sheets.find(s => s.id === state.settings.activeSheetId)) {
        const first = ordered()[0];
        if (first) state.settings.activeSheetId = first.id;
      }

      // ── Phase 2 migration: ensure all objects carry required fields ──
      state.sheets.forEach(sh => {
        if (!Array.isArray(sh.folders)) sh.folders = [];
        sh.folders.forEach((fo, fi) => {
          if (typeof fo.collapsed !== 'boolean') fo.collapsed = false;
          if (typeof fo.order     === 'undefined') fo.order   = fi;
          if (!Array.isArray(fo.links)) fo.links = [];
          fo.links.forEach((lk, li) => {
            if (typeof lk.name        === 'undefined') lk.name        = '';
            if (typeof lk.url         === 'undefined') lk.url         = '';
            if (typeof lk.description === 'undefined') lk.description = '';
            if (typeof lk.order       === 'undefined') lk.order       = li;
          });
        });
      });
      persist();  // write back any migrated fields

      // Apply saved theme — must happen before initTopActions so the button
      // renders the correct initial icon (sun vs moon)
      if (state.settings?.theme === 'light') document.body.classList.add('light');

      // ── Phase 4: build Export / Import / Theme buttons in top bar ──
      initTopActions();

      // ── Wire up + Add Folder button ──
      document.getElementById('btn-add-folder')
              .addEventListener('click', addFolder);

      // ── Wire up search (Phase 3) ─────────────────────────────────
      const searchInput = document.getElementById('search-input');

      // Live search with 200ms debounce
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const raw = searchInput.value;
        // If the input is empty or blank, close the dropdown immediately
        if (!raw.trim()) {
          collapseDropdown();
          return;
        }
        searchTimer = setTimeout(() => {
          const results = performSearch(raw);
          showSearchDropdown(results, raw.trim());
        }, 200);
      });

      // Escape: clear input + close dropdown
      searchInput.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          e.preventDefault();
          closeSearch();
          searchInput.blur();
        }
      });

      // Click outside search-wrap: close dropdown (keep input text)
      document.addEventListener('click', e => {
        const wrap = document.getElementById('search-wrap');
        if (wrap && !wrap.contains(e.target)) {
          collapseDropdown();
        }
      });

      renderAll();
    })();
  </script>
</body>
</html>
